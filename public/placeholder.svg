<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bg)" />
  
  <!-- Grid Matrix Overlay -->
  <g stroke="#1f293d" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
  </g>

  <!-- Technical Frame -->
  <rect x="40" y="40" width="520" height="520" fill="none" stroke="#2a3854" stroke-width="1.5" stroke-dasharray="10 6" />
  <circle cx="40" cy="40" r="4" fill="#00f2fe" />
  <circle cx="560" cy="40" r="4" fill="#00f2fe" />
  <circle cx="40" cy="560" r="4" fill="#00f2fe" />
  <circle cx="560" cy="560" r="4" fill="#00f2fe" />

  <!-- Center Microchip HUD -->
  <g transform="translate(200, 180)">
    <rect x="10" y="10" width="180" height="180" rx="16" fill="#131d2e" stroke="url(#cyanGlow)" stroke-width="2.5" filter="url(#glow)" />
    <!-- Die pins -->
    <path d="M 40 10 L 40 -5 M 70 10 L 70 -5 M 100 10 L 100 -5 M 130 10 L 130 -5 M 160 10 L 160 -5" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
    <path d="M 40 190 L 40 205 M 70 190 L 70 205 M 100 190 L 100 205 M 130 190 L 130 205 M 160 190 L 160 205" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
    <path d="M 10 40 L -5 40 M 10 70 L -5 70 M 10 100 L -5 100 M 10 130 L -5 130 M 10 160 L -5 160" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
    <path d="M 190 40 L 205 40 M 190 70 L 205 70 M 190 100 L 205 100 M 190 130 L 205 130 M 190 160 L 205 160" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
    <!-- Internal Core -->
    <rect x="50" y="50" width="100" height="100" rx="8" fill="#1a273d" stroke="#374d75" stroke-width="1.5" />
    <text x="100" y="110" font-family="monospace" font-size="28" font-weight="900" fill="#00f2fe" text-anchor="middle">Y0</text>
  </g>

  <!-- Typography Telemetry -->
  <text x="300" y="440" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    SILICON HARDWARE ASSET
  </text>
  <text x="300" y="470" font-family="monospace" font-size="12" fill="#64748b" letter-spacing="2" text-anchor="middle">
    // AWAITING REPOSITORY RENDER //
  </text>
</svg>
