<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2bbff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#070f1e"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════ -->
  <!-- ICON BADGE (200×200 viewport left side)   -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Outer badge square -->
  <rect x="10" y="10" width="180" height="180" rx="24" ry="24"
    fill="url(#faceGrad)"
    stroke="url(#cyanGrad)"
    stroke-width="2.5"
    filter="url(#outerGlow)"
  />

  <!-- Inner frame -->
  <rect x="20" y="20" width="160" height="160" rx="18" ry="18"
    fill="none" stroke="#00f2fe" stroke-width="0.6" stroke-opacity="0.2"
  />

  <!-- Corner pin dots -->
  <circle cx="34"  cy="34"  r="3" fill="#00f2fe" fill-opacity="0.7"/>
  <circle cx="166" cy="34"  r="3" fill="#00f2fe" fill-opacity="0.7"/>
  <circle cx="34"  cy="166" r="3" fill="#d2bbff" fill-opacity="0.7"/>
  <circle cx="166" cy="166" r="3" fill="#d2bbff" fill-opacity="0.7"/>

  <!-- Circuit traces -->
  <line x1="20"  y1="58"  x2="68"  y2="58"  stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="68" cy="58" r="1.8" fill="#00f2fe"/>
  <line x1="68"  y1="58"  x2="68"  y2="78"  stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="180" y1="68"  x2="132" y2="68"  stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="132" cy="68" r="1.8" fill="#00f2fe"/>
  <line x1="132" y1="68"  x2="132" y2="78"  stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="20"  y1="142" x2="62"  y2="142" stroke="#d2bbff" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="62" cy="142" r="1.8" fill="#d2bbff"/>
  <line x1="62"  y1="142" x2="62"  y2="122" stroke="#d2bbff" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="180" y1="130" x2="136" y2="130" stroke="#d2bbff" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="136" cy="130" r="1.8" fill="#d2bbff"/>
  <line x1="136" y1="130" x2="136" y2="122" stroke="#d2bbff" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- CPU die core -->
  <rect x="56" y="56" width="88" height="88" rx="6" ry="6"
    fill="#0a1628"
    stroke="url(#cyanGrad)"
    stroke-width="1.5"
    filter="url(#cyanGlow)"
  />

  <!-- Core crosshatch -->
  <line x1="56"  y1="100" x2="144" y2="100" stroke="#00f2fe" stroke-width="0.4" stroke-opacity="0.15"/>
  <line x1="100" y1="56"  x2="100" y2="144" stroke="#00f2fe" stroke-width="0.4" stroke-opacity="0.15"/>

  <!-- Y0 logotype inside core -->
  <text x="62" y="124"
    font-family="'Courier New', Courier, monospace"
    font-size="52" font-weight="900" letter-spacing="-2"
    fill="url(#cyanGrad)" filter="url(#cyanGlow)"
  >Y</text>
  <text x="100" y="124"
    font-family="'Courier New', Courier, monospace"
    font-size="52" font-weight="900"
    fill="#ffffff" fill-opacity="0.95"
  >0</text>

  <!-- Top micro label -->
  <text x="100" y="46"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="7" font-weight="700" letter-spacing="3"
    fill="#00f2fe" fill-opacity="0.55"
  >SILICON</text>

  <!-- Bottom micro label -->
  <text x="100" y="172"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="6" font-weight="600" letter-spacing="2"
    fill="#d2bbff" fill-opacity="0.55"
  >EGY · MKT</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- TYPOGRAPHY LOCKUP (right of badge)        -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Vertical divider -->
  <line x1="220" y1="52" x2="220" y2="148"
    stroke="#00f2fe" stroke-width="1" stroke-opacity="0.25"
  />

  <!-- Primary wordmark: Y0 -->
  <text x="244" y="122"
    font-family="'Courier New', Courier, monospace"
    font-size="72" font-weight="900" letter-spacing="-2"
    fill="#ffffff" filter="url(#textGlow)"
  >Y<tspan fill="#00f2fe">0</tspan></text>

  <!-- Separator pipe -->
  <text x="378" y="122"
    font-family="'Courier New', Courier, monospace"
    font-size="72" font-weight="100"
    fill="#ffffff" fill-opacity="0.2"
  >|</text>

  <!-- HARDWARE label -->
  <text x="418" y="102"
    font-family="'Courier New', Courier, monospace"
    font-size="38" font-weight="800" letter-spacing="6"
    fill="url(#cyanGrad)" filter="url(#cyanGlow)"
  >HARDWARE</text>

  <!-- MARKET // EGY sub-label -->
  <text x="420" y="136"
    font-family="'Courier New', Courier, monospace"
    font-size="16" font-weight="600" letter-spacing="8"
    fill="#ffffff" fill-opacity="0.3"
  >MARKET // EGY</text>
</svg>
