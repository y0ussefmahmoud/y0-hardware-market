<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Cyan glow gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <!-- Purple accent gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2bbff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Corner diagonal gradient for badge face -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#070f1e"/>
    </linearGradient>
    <!-- Cyan glow filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft outer glow -->
    <filter id="outerGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══ OUTER BORDER SQUARE (rounded die badge) ═══ -->
  <rect x="32" y="32" width="448" height="448" rx="64" ry="64"
    fill="url(#faceGrad)"
    stroke="url(#cyanGrad)"
    stroke-width="6"
    filter="url(#outerGlow)"
  />

  <!-- ═══ INNER FRAME (inset border) ═══ -->
  <rect x="56" y="56" width="400" height="400" rx="48" ry="48"
    fill="none"
    stroke="#00f2fe"
    stroke-width="1.5"
    stroke-opacity="0.25"
  />

  <!-- ═══ CIRCUIT TRACE LINES — Horizontal ═══ -->
  <!-- Top cluster -->
  <line x1="56" y1="140" x2="210" y2="140" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="210" cy="140" r="3.5" fill="#00f2fe" fill-opacity="0.9"/>
  <line x1="210" y1="140" x2="210" y2="180" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5"/>

  <line x1="456" y1="160" x2="300" y2="160" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="300" cy="160" r="3.5" fill="#00f2fe" fill-opacity="0.9"/>
  <line x1="300" y1="160" x2="300" y2="200" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Bottom cluster -->
  <line x1="56" y1="370" x2="180" y2="370" stroke="#d2bbff" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="180" cy="370" r="3.5" fill="#d2bbff" fill-opacity="0.9"/>
  <line x1="180" y1="370" x2="180" y2="340" stroke="#d2bbff" stroke-width="1.5" stroke-opacity="0.5"/>

  <line x1="456" y1="350" x2="330" y2="350" stroke="#d2bbff" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="330" cy="350" r="3.5" fill="#d2bbff" fill-opacity="0.9"/>
  <line x1="330" y1="350" x2="330" y2="310" stroke="#d2bbff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- ═══ CORNER PIN DOTS (CPU-die style) ═══ -->
  <!-- Top-left -->
  <circle cx="96"  cy="96"  r="6" fill="#00f2fe" fill-opacity="0.7"/>
  <!-- Top-right -->
  <circle cx="416" cy="96"  r="6" fill="#00f2fe" fill-opacity="0.7"/>
  <!-- Bottom-left -->
  <circle cx="96"  cy="416" r="6" fill="#d2bbff" fill-opacity="0.7"/>
  <!-- Bottom-right -->
  <circle cx="416" cy="416" r="6" fill="#d2bbff" fill-opacity="0.7"/>

  <!-- ═══ CPU DIE CORE SQUARE ═══ -->
  <rect x="148" y="148" width="216" height="216" rx="12" ry="12"
    fill="#0a1628"
    stroke="url(#cyanGrad)"
    stroke-width="3"
    filter="url(#cyanGlow)"
  />

  <!-- ═══ INNER CORE CROSSHATCH ═══ -->
  <line x1="148" y1="256" x2="364" y2="256" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.15"/>
  <line x1="256" y1="148" x2="256" y2="364" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.15"/>
  <line x1="148" y1="202" x2="364" y2="202" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="148" y1="310" x2="364" y2="310" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="202" y1="148" x2="202" y2="364" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="310" y1="148" x2="310" y2="364" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- ═══ Y0 LOGOTYPE — CENTER OF DIE ═══ -->
  <!-- "Y" glyph — constructed from paths -->
  <text
    x="174" y="296"
    font-family="'Courier New', Courier, monospace"
    font-size="128"
    font-weight="900"
    letter-spacing="-4"
    fill="url(#cyanGrad)"
    filter="url(#cyanGlow)"
  >Y</text>
  <!-- "0" with cyan accent -->
  <text
    x="282" y="296"
    font-family="'Courier New', Courier, monospace"
    font-size="128"
    font-weight="900"
    fill="#ffffff"
    fill-opacity="0.95"
  >0</text>

  <!-- ═══ SCAN LINE OVERLAY (subtle) ═══ -->
  <rect x="148" y="148" width="216" height="216" rx="12" ry="12"
    fill="url(#scanLines)"
    opacity="0.04"
  />

  <!-- ═══ TOP BADGE LABEL ═══ -->
  <text
    x="256" y="124"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="18"
    font-weight="700"
    letter-spacing="6"
    fill="#00f2fe"
    fill-opacity="0.6"
  >SILICON</text>

  <!-- ═══ BOTTOM BADGE LABEL ═══ -->
  <text
    x="256" y="406"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="14"
    font-weight="600"
    letter-spacing="4"
    fill="#d2bbff"
    fill-opacity="0.6"
  >EGY · MKT</text>
</svg>
